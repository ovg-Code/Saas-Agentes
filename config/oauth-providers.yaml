# Catálogo de proveedores OAuth2 de la PLATAFORMA: las apps OAuth son nuestras (una por proveedor) y cada cliente
# solo autoriza con su cuenta. client_id/client_secret vienen del entorno: OAUTH_<ID>_CLIENT_ID / _CLIENT_SECRET.
# ${VAR:-defecto} se sustituye con variables de entorno al cargar.
providers:
  google:
    name: Google
    authorize_url: https://accounts.google.com/o/oauth2/v2/auth
    token_url: https://oauth2.googleapis.com/token
    default_scopes: [https://www.googleapis.com/auth/calendar.events]
    # sin esto Google no devuelve refresh_token
    authorize_params: { access_type: offline, prompt: consent }
  microsoft:
    name: Microsoft 365
    authorize_url: https://login.microsoftonline.com/common/oauth2/v2.0/authorize
    token_url: https://login.microsoftonline.com/common/oauth2/v2.0/token
    default_scopes: [offline_access, Calendars.ReadWrite]
  hubspot:
    name: HubSpot
    authorize_url: https://app.hubspot.com/oauth/authorize
    token_url: https://api.hubapi.com/oauth/v1/token
    default_scopes: [crm.objects.contacts.read, crm.objects.contacts.write]
  mock:
    name: Proveedor simulado (desarrollo)
    authorize_url: ${OAUTH_MOCK_URL:-http://localhost:9093}/authorize
    token_url: ${OAUTH_MOCK_URL:-http://localhost:9093}/token
    default_scopes: [calendar.events]
