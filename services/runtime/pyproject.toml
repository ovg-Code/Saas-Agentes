[project]
name = "agentes-runtime"
version = "0.1.0"
description = "Runtime de agentes: compila releases, ejecuta el loop agéntico con políticas, tools y RAG; worker de Temporal"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=1.8",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.28",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "jsonschema>=4.23",
  "psycopg[binary,pool]>=3.2",
  "temporalio>=1.33",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentes_runtime"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
