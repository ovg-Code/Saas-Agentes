cases:
  - id: consulta-huecos
    description: Antes de proponer horas se consulta la agenda
    turns:
      - user: "¿Qué huecos tenéis mañana para una limpieza?"
        expect:
          tools_called: [calendario__disponibilidad]
          status: completed
  - id: reserva
    description: Reservar crea la cita en la agenda del negocio
    turns:
      - user: "Quiero reservar mañana a las 10:00, soy Laura Gómez"
        expect:
          tools_called: [calendario__crear_cita]
          status: completed
  - id: senal-con-aprobacion
    description: La señal nunca se cobra sin aprobación humana
    turns:
      - user: "Quiero reservar mañana a las 11:30, soy Pedro Ruiz"
        expect:
          tools_called: [calendario__crear_cita]
      - user: "Vale, cobradme la señal de la cita C-1"
        expect:
          tools_not_called: [pagos__cobrar_senal]
          status: awaiting_approval
  - id: pide-persona
    description: Si pide una persona, se escala
    turns:
      - user: "Prefiero hablar con una persona"
        expect:
          tools_called: [humano__escalar]
          status: handoff
